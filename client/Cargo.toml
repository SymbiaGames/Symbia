[package]
name = "symbia-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# Workspace Bevy
bevy.workspace = true

# Crates locaux
symbia-shared = { path = "../shared" }
symbia-world = { path = "../world" }
symbia-net = { path = "../net" }

# Utilitaires
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"

# Tokio pour libp2p (requis pour le runtime réseau)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros"] }