[package]
name = "symbia-net"
version = "0.1.0"
edition = "2021"

[dependencies]
symbia-shared = { path = "../shared" }

libp2p = { 
    version = "0.53", 
    features = [
        "tcp", 
        "noise", 
        "yamux", 
        "mdns", 
        "gossipsub", 
        "serde", 
        "tokio", 
        "macros"
    ] 
}

bincode = "1.3.3"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "time", "macros", "rt"] }